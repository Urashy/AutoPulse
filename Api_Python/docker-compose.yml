version: '3.8'

services:
  api:
    build: .
    container_name: fastapi_ia_auto
    ports:
      - "8000:8000"
    volumes:
      - ./saved_ia:/app/saved_ia
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
