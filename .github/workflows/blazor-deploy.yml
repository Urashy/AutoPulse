name: Deploy Blazor to Azure (with credentials)

on:
  push:
    branches:
      - PreProd
    paths:
      - 'BlazorAutoPulse/**'
      - 'AutoPulse.Shared/**'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: blazor-autopulse-c2ehbpd0hzh9e8he
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore and Build Shared
      run: |
        dotnet restore ./AutoPulse.Shared/AutoPulse.Shared.csproj
        dotnet build ./AutoPulse.Shared/AutoPulse.Shared.csproj --configuration Release --no-restore

    - name: Restore and Build Blazor
      run: |
        dotnet restore ./BlazorAutoPulse/BlazorAutoPulse.csproj
        dotnet build ./BlazorAutoPulse/BlazorAutoPulse.csproj --configuration Release --no-restore

    - name: Publish Blazor
      run: dotnet publish ./BlazorAutoPulse/BlazorAutoPulse.csproj --configuration Release --no-build --output ./publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: blazor-app
        path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: blazor-app

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: .

    - name: Logout from Azure
      run: az logout

    - name: Health Check
      run: |
        sleep 30
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net)
        echo "Status: $HTTP_CODE"
        [ $HTTP_CODE -eq 200 ] && echo "✅ Success" || echo "⚠️ Failed"