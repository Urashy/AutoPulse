name: Deploy API to Azure

on:
  push:
    branches: [ main, PreProd ]
    paths:
      - 'Api_c_sharp/**'
      - 'AutoPulse.Shared/**'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: api-autopulse-d8hgfvgjbsapataf
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore Api_c_sharp/Api_c_sharp.csproj
    
    - name: Build
      run: dotnet build Api_c_sharp/Api_c_sharp.csproj --configuration Release --no-restore
    
    - name: Publish
      run: dotnet publish Api_c_sharp/Api_c_sharp.csproj --configuration Release --no-build --output ./publish
    
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
        package: ./publish