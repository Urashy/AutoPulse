name: Deploy API

on:
  push:
    branches:
      - PreProd
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      id-token: write  # Obligatoire pour la connexion Azure OIDC
      contents: read
      
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build Solution
        # Cherche le .sln n'importe où et le compile
        run: |
          $solution = Get-ChildItem -Path . -Filter *.sln -Recurse | Select-Object -First 1
          if (-not $solution) { throw "Aucun fichier .sln trouve !" }
          Write-Host "Solution found: $($solution.FullName)"
          dotnet build $solution.FullName --configuration Release

      - name: Publish API Project
        # Cherche le .csproj de l'API et le publie
        run: |
          $project = Get-ChildItem -Path . -Filter Api_c_sharp.csproj -Recurse | Select-Object -First 1
          if (-not $project) { throw "Projet Api_c_sharp.csproj introuvable !" }
          dotnet publish $project.FullName -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          # Assurez-vous que ces secrets existent toujours dans GitHub Settings
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D1964CACFC5B48278E8C72393C6E707A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B1C8FBF083BD401DA06411253E1FF0EF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_63B2137F1871410D93DA74480FA683B2 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Azure-Api-AutoPulse' # Vérifiez que c'est le bon nom de votre WebApp API sur Azure
          slot-name: 'Production'
          package: .
