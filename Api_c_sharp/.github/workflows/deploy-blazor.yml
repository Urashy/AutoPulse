name: Deploy Blazor to Azure

on:
  push:
    branches: [ main ]
    paths:
      - 'BlazorAutoPulse/**'
      - 'AutoPulse.Shared/**'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: blazor-autopulse-c2ehbpd0hzh9e8he
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore BlazorAutoPulse/BlazorAutoPulse.csproj
    
    - name: Build
      run: dotnet build BlazorAutoPulse/BlazorAutoPulse.csproj --configuration Release --no-restore
    
    - name: Publish
      run: dotnet publish BlazorAutoPulse/BlazorAutoPulse.csproj --configuration Release --no-build --output ./publish
    
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BLAZOR }}
        package: ./publish